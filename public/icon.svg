<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded Android squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- 3D Printer Frame -->
  <path d="M128 390 L384 390" stroke="#475569" stroke-width="16" stroke-linecap="round"/>
  <path d="M160 390 L160 160 L352 160 L352 390" fill="none" stroke="#64748b" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Top Gantry Bar -->
  <line x1="130" y1="230" x2="382" y2="230" stroke="#94a3b8" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Extruder / Toolhead -->
  <rect x="232" y="212" width="48" height="42" rx="8" fill="url(#accent)"/>
  <polygon points="248,254 264,254 256,276" fill="#f59e0b"/>
  <!-- Extrusion tip glow -->
  <circle cx="256" cy="282" r="5" fill="#38bdf8"/>

  <!-- Printed layers -->
  <path d="M210 350 L302 350" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  <path d="M224 330 L288 330" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  <path d="M240 310 L272 310" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>

  <!-- Rp badge or Currency symbol -->
  <g transform="translate(340, 100)">
    <circle cx="40" cy="40" r="48" fill="url(#glow)"/>
    <text x="40" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">Rp</text>
  </g>

  <!-- Filament Spool representation -->
  <g transform="translate(100, 96)">
    <circle cx="36" cy="36" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
    <circle cx="36" cy="36" r="14" fill="#0f172a" stroke="#64748b" stroke-width="4"/>
  </g>
</svg>
